name: Publish

on:
  push:
    tags: ["v*"]

# Trusted publishing: npm accepts a short-lived OIDC token minted for THIS
# workflow in THIS repository, so there is no long-lived npm token to store,
# leak, or rotate. Provenance is generated automatically on that basis — the
# registry records which workflow, at which commit, built the tarball.
permissions:
  contents: read
  id-token: write

jobs:
  # A published version can never be taken back, so the first thing checked is
  # the thing a human cannot see from a tag: that the tag is on main.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag must be an ancestor of main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::${{ github.ref_name }} is not on main — refusing to publish unreviewed code."
            exit 1
          fi
      - name: The tag must match the version of every package
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for manifest in packages/*/package.json; do
            version="$(node -p "require('./$manifest').version")"
            [ "$version" = "$tag" ] || {
              echo "::error::tag $tag but $manifest says $version"
              exit 1
            }
          done

  # Not a check someone looked at beforehand: the same suites, in this run, on
  # the tagged commit, as a job publish `needs`.
  test:
    needs: guard
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # No `registry-url`. It makes setup-node write an .npmrc containing
      # `_authToken=${NODE_AUTH_TOKEN}`, and with no token supplied it fills in
      # its own placeholder — so npm finds a credential, uses it instead of
      # performing the OIDC exchange, and the registry answers 404 (which is
      # what it returns for a failed auth, to avoid confirming a package
      # exists). npm defaults to registry.npmjs.org anyway.
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0…
          node-version: 22
          cache: pnpm
      # …and npm >= 11.5.1, which is newer than the npm bundled with Node 22.
      # Without this the publish falls back to looking for a token and fails
      # with an authentication error that says nothing about OIDC.
      - name: npm new enough to speak OIDC
        run: |
          npm install -g npm@latest
          npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # `pnpm pack` writes the version of the core into the React and Vue
      # packages in place of `workspace:*`; `npm publish` of the manifest as it
      # stands would publish that specifier as it is. The core goes first: the
      # other two depend on that exact version.
      #
      # No token, and no --provenance: the OIDC exchange supplies the
      # credential and generates the attestation. `access` comes from
      # publishConfig in each package.json.
      - name: Publish
        run: |
          for package in core react vue; do
            (cd "packages/$package" && pnpm pack --pack-destination ../../packed)
          done
          version="${GITHUB_REF_NAME#v}"
          # A version already on npm is skipped, so a release that stopped
          # half way, or whose first packages were published by hand, can run.
          release() {
            if npm view "$1@$version" version >/dev/null 2>&1; then
              echo "$1@$version is already on npm"
            else
              npm publish "$2"
            fi
          }
          release @latentic/live-markdown-core "./packed/latentic-live-markdown-core-$version.tgz"
          release @latentic/live-markdown-vue "./packed/latentic-live-markdown-vue-$version.tgz"
          release @latentic/live-markdown "./packed/latentic-live-markdown-$version.tgz"
