name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by publish.yml so the release runs these suites on the tagged
  # commit, in the same run, rather than trusting an earlier green tick.
  workflow_call:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform reports independently: one break must not cancel the
      # others, since the point is to see the whole picture in one run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The declaration build is its own gate: `tsc --noEmit` never emits, so
      # the errors that only appear when rolling up types (an exported
      # anonymous class, an inferred type naming a transitive dependency) are
      # invisible until a publish fails.
      - run: pnpm build
      - run: pnpm test

  browser:
    name: browser (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit
      # Layout is the whole point of this tier — jsdom has no layout engine and
      # green-lights caret geometry, click placement, and KaTeX metrics alike.
      - run: pnpm test:browser

  model:
    name: model (TLA+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The checksum pins the checker: a different jar fails here, not in a
      # result nobody can explain.
      - name: Fetch TLC
        run: |
          mkdir -p .tools
          curl -fsSL -o .tools/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  .tools/tla2tools.jar" | sha256sum -c -
      # `LineKeysRules.tla` is generated; the test job fails when it is stale.
      - name: Check the line-key model
        working-directory: model
        run: java -cp ../.tools/tla2tools.jar tlc2.TLC -config LineKeys.cfg LineKeys.tla
      # The same model over the rules of a host's module (hostExample.test.ts).
      - name: Check the line-key model with a host's rules
        working-directory: model/host-example
        run: |
          cp ../LineKeys.tla ../LineKeys.cfg .
          java -cp ../../.tools/tla2tools.jar tlc2.TLC -config LineKeys.cfg LineKeys.tla
